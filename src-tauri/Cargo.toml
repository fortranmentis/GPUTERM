[package]
name = "gputerm"
version = "1.3.7-beta"
description = "GpuTerm desktop SSH/SFTP client with GPU monitoring"
authors = ["GpuTerm"]
license = "PolyForm-Noncommercial-1.0.0"
repository = ""
edition = "2021"
rust-version = "1.88"

[lib]
name = "gputerm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Encodes PowerShell scripts for -EncodedCommand so Windows telemetry commands
# survive whichever default shell (cmd.exe or PowerShell) the OpenSSH server uses.
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
drag = "2.1.1"
# Expands ssh_config `Include` patterns such as `conf.d/*`.
glob = "0.3"
portable-pty = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Generates the per-profile SSH keys and the key manager's key pairs
# (Ed25519, RSA, ECDSA) and exports them in OpenSSH format.
ssh-key = { version = "0.6.7", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
# TCP keepalive tuning on SSH sockets, so a dead peer is noticed in seconds.
socket2 = { version = "0.6", features = ["all"] }
# openssl-on-win32 + vendored-openssl build libssh2 against OpenSSL instead of
# WinCNG so modern key-exchange algorithms (curve25519-sha256, ecdh-sha2-nistp*)
# are available on Windows; the WinCNG backend only offers modp DH groups,
# which current OpenSSH servers no longer accept by default.
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Pinned to the 2.4 line, matching @tauri-apps/plugin-notification.
tauri-plugin-notification = "~2.4"
# Keep the notification plugin's desktop dependency compatible with Rust 1.88.
notify-rust = "=4.17.0"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1.8"
ureq = { version = "3.3", features = ["json", "platform-verifier"] }
tauri-plugin-updater = "~2.11"
tauri-plugin-process = "~2.3"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "0.18"
gtk = "0.18"
url = "2"

# RSA key generation is unusably slow unoptimized (several minutes for 4096
# bits in a debug build); optimize just the big-number crates.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# Touch ID unlock of the credential vault: LocalAuthentication gates reading
# the vault key from the login Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LABiometryType", "LAContext", "LAError"] }
security-framework = "3"

# Windows Hello unlock of the credential vault: the vault key is protected
# with DPAPI for the current user and released after Windows Hello verifies.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT"] }
windows-future = "0.2"

name: CI

# Runs the checks the README asks contributors to run, so a push or pull
# request cannot land with failing tests, lints, or type errors.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri links against webkit2gtk on Linux, so the Rust crate needs these
      # even for `cargo test`.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Cargo.toml declares the supported MSRV. Without this job that declaration
  # silently rots, because every other build uses the stable toolchain.
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read declared MSRV
        id: msrv
        run: |
          VERSION="$(grep -m1 '^rust-version' src-tauri/Cargo.toml | sed -E 's/.*"(.+)".*/\1/')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Check against the declared MSRV
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
